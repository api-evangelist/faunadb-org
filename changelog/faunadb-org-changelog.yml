- breaking: false
  highlights:
  - The definition of "identity" is changing to include third‑party authentication.
  - We are taking this opportunity to rename the function to better describe what it does.
  - For API version 4.0 and newer, use the CurrentIdentity function.
  date: 2020-11-01T00:00:00Z?date=November 2020&version=4.0
- breaking: false
  highlights:
  - The Contains function needed a more specific name, so the ContainsPath alias has been created.
  - For API version 3.0 and newer, use ContainsPath, and the related ContainsField and ContainsValue functions.
  date: 2020-08-01T00:00:00Z?date=August 2020&version=3.0
- breaking: false
  highlights:
  - The legacy authentication system provided a simplistic way to establish a key that applications could use to perform queries for "unauthenticated"
    users.
  - Use the newer Attribute‑based access control (ABAC) system instead, as it provides much greater control and flexibility.
  date: 2020-05-01T00:00:00Z?date=May 2020&version=2.12.0
- breaking: false
  highlights:
  - The priority option, a parameter to the CreateDatabase and CreateKey functions, was intended for on‑premise operators to signal how to prioritize
    limited resources.
  - Since Fauna operates its cloud service in a way that always provides available capacity, priority has not served a purpose for Fauna Cloud.
  date: 2019-12-01T00:00:00Z?date=December 2019&version=2.10.1
